name: Build offline bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Prepare WinGet and YAML tools
        run: |
          Install-Module Microsoft.WinGet.Client -Repository PSGallery -Scope CurrentUser -Force
          Repair-WinGetPackageManager -AllUsers
          Install-Module powershell-yaml -RequiredVersion 0.4.12 -Repository PSGallery -Scope CurrentUser -Force
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'WinGet is unavailable' }
      - name: Test bundle processing and HTTP server
        run: ./tests/test.ps1
      - name: Download and pack
        run: ./scripts/build.ps1
      - name: Merge, extract and verify with Windows PowerShell 5.1
        timeout-minutes: 15
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File dist/extract.ps1 -DestinationDirectory .work/verify
          if ($LASTEXITCODE -ne 0) { throw 'Bundle extraction failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .work/verify/install.ps1 -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw 'Bundle verification failed' }
      - name: Upload ZIP parts and extraction scripts
        uses: actions/upload-artifact@v4
        with:
          name: winget-offline-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winget-offline-${{ github.run_number }}
          path: dist
      - name: Publish timestamped release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          timestamp=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)
          cat > release-notes.md <<EOF
          WinGet 离线安装包，构建自提交 ${TARGET_SHA}。

          将全部 .zip.001、.zip.002 等切块、bundle-parts.json、extract.cmd 和 extract.ps1 下载到同一目录。
          双击 extract.cmd 校验、合并并解压，再运行解压目录中的 install.cmd。每块最大 1 GiB，目标机器需要已安装 WinGet。
          发布时间：${timestamp}（北京时间）。
          EOF
          # Publish only after every asset has uploaded successfully.
          gh release create "$timestamp" dist/* --target "$TARGET_SHA" --title "$timestamp" --notes-file release-notes.md --draft
          gh release edit "$timestamp" --draft=false --latest
